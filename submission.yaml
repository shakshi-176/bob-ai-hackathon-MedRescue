submission:
  title: "MedRescue AI"
  problem_statement: >
    Pharmacies and hospitals discard large quantities of unexpired medicine
    because there is no system to identify who needs it before it expires,
    while nearby locations simultaneously face shortages of that exact
    medicine - a visibility and coordination gap, not a supply problem.
  solution_summary: >
    MedRescue AI lets pharmacies and hospitals register medicine stock with
    expiry dates. The system monitors this data, flags medicines nearing
    expiry using tiered urgency rules, automatically matches them to nearby
    locations with real need using a rule-based ranking engine, and sends
    automated notifications recommending the transfer.
  key_features:
    - "Automated expiry risk detection with tiered alerts (30/15/7 days, adjusted by medicine type)"
    - "Rule-based matching engine ranking recipients by need, quantity, and proximity"
    - "Auto-generated notifications explaining each match's reasoning"
    - "Transparent pricing breakdown with simulated order and payment flow"
  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["Flask"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: []
  what_we_are_most_proud_of: >
    The end-to-end matching engine, which reasons across expiry urgency,
    quantity, and proximity to recommend the best redistribution match -
    not just a simple lookup or alert system - combined with a full
    request-to-payment flow that makes the recommendation actionable.
  known_limitations: >
    Uses simulated inventory data rather than live pharmacy/hospital data.
    Transfers require human approval before execution. Cold-chain and
    controlled substances are excluded from this version. Passwords are
    stored in plaintext for this prototype rather than hashed.

