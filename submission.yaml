submission:
  title: "MedRescue AI"
  problem_statement: >
    Pharmacies and hospitals discard large quantities of unexpired medicine
    because there is no system to identify who needs it before it expires,
    while nearby locations simultaneously face shortages of that exact
    medicine - a visibility and coordination gap, not a supply problem.
  solution_summary: >
    MedRescue AI lets pharmacies and hospitals register medicine stock with
    expiry dates. The system flags medicines nearing expiry, matches them to
    nearby locations with real need using rule-based ranking logic, and
    generates a recommended transfer with a clear price breakdown for human
    approval.
  key_features:
    - "Tiered expiry risk alerts (30/15/7 days, adjusted by medicine type) so users can act before stock is wasted"
    - "Rule-based matching engine ranking recipients by need, quantity fit, and proximity"
    - "Auto-generated notifications explaining each recommended match"
    - "Transparent pricing breakdown with simulated order and payment flow"
  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["Flask"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: []
  what_we_are_most_proud_of: >
    The matching engine, which reasons across expiry urgency, quantity, and
    proximity to recommend the best redistribution match - not just a simple
    lookup or alert system - combined with a full request-to-payment flow
    that makes the recommendation actionable.
  known_limitations: >
    Uses simulated inventory data rather than live pharmacy/hospital data.
    Transfers require human approval before execution. Cold-chain and
    controlled substances are excluded from this version. Matching logic is
    rule-based rather than a trained AI model; IBM Bob was used as the
    development-time coding agent rather than a runtime component. Passwords
    are stored in plaintext for this prototype rather than hashed.

