submission:
  title: "MedRescue AI"                            
  problem_statement: >                 
		Pharmacies and hospitals discard large quantities of unexpired medicine
   		because there is no system to identify who needs it before it expires,
   		while nearby locations simultaneously face shortages of that exact
    		medicine — a visibility and coordination gap, not a supply problem.	

  solution_summary: >                  
		MedRescue AI lets pharmacies and hospitals register medicine stock with
    		expiry dates. AI monitors this data, flags medicines nearing expiry,
   	 	automatically matches them to nearby locations with real need using
   	 	AI-ranked matching, and sends AI-generated notifications recommending
		the transfer.
  key_features:                      
    - "AI-powered expiry risk prediction with tiered alerts (30/15/7 days)"
    - "AI-driven matching engine ranking recipients by need, quantity, and proximity"
    - "Auto-generated, reasoned notifications explaining each match"
    - "Outcome tracking to improve future predictions"    
                              
  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]                      
    frameworks: ["Flask"]                     
    ibm_technologies: ["IBM Bob"]               
    databases: ["SQLite"]                      
    other: []                         
  what_we_are_most_proud_of: >         
	The AI-driven matching engine, which reasons across expiry urgency,
        quantity, and proximity to recommend the best redistribution match —
        not just a simple lookup or alert system.

  known_limitations: >                 
     	Uses simulated inventory data rather than live pharmacy/hospital data.
    	Transfers require human approval before execution. Cold-chain and
    	controlled substances are excluded from this version.

